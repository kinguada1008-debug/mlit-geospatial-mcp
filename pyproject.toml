[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlit-geospatial-mcp"
version = "0.1.0"
description = "MLIT Geospatial MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anyio",
    "mcp",
    "shapely",
    "pyproj",
    "requests",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
